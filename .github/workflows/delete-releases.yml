name: Delete releases

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Space-separated release tags to delete, along with their git tags"
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ github.event.inputs.tags }}
        run: |
          for tag in $TAGS; do
            echo "Deleting $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
